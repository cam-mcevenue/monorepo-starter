packages:
  - apps/*
  - packages/*
  # Templates are workspace members so `vp check`/`lint`/`test` keep them valid.
  - packages/cli/templates/*
  - scratchpad

catalogMode: prefer

catalog:

catalogs:
  effect:
    "@effect/ai-anthropic": 4.1.4
    "@effect/ai-openai": 4.1.4
    "@effect/ai-openai-compat": 4.1.4
    "@effect/ai-openrouter": 4.1.4
    "@effect/ai-typesafe": 4.1.4
    "@effect/opentelemetry": 4.1.4
    "@effect/platform-node": 4.1.4
    "@effect/sql-sqlite-node": 4.1.4
    "@effect/vitest": 4.1.4
    effect: 4.1.4
  infra:
    "@alchemy.run/frontend-frameworks": 2.0.0-beta.85
    "@alchemy.run/cloudflare": 2.0.0-beta.85
    "@alchemy.run/doppler": 2.0.0-beta.85
    alchemy: 2.0.0-beta.85
  tooling:
    "@effect/tsgo": 0.68.0
    "@types/node": 26.6.6
    typescript: 7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0
    vitest: 5.1.0

overrides:
  vite@*: "catalog:tooling"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# This template deliberately rides current versions (effect 4, TypeScript 7, node 26,
# alchemy beta), so the release-age gate is off rather than maintained as an allowlist.
minimumReleaseAge: 0

# Vite+ owns the toolchain: it manages Node (from .node-version) and pnpm itself.
# Without this, pnpm would also act on devEngines.packageManager and the two can
# select different pnpm versions, so commands behave differently depending on
# which one started them.
pmOnFail: ignore

supportedArchitectures:
  os: [darwin, linux]
  cpu: [arm64]
  libc: [glibc]
